<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MiniChallenge — 5 minutes a day</title>
<meta name="description" content="One small challenge per day to improve your life. Streaks, progress, sharing." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">

<link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="shortcut icon" href="favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="manifest" href="site.webmanifest" />
  
</head>

<body>
  <div id="app"></div>

  <!-- Bottom Navigation -->
  <nav id="bottom-nav" class="bottom-nav hidden">
    <button class="nav-item active" data-route="home">
      <span>Today</span>
    </button>
    <button class="nav-item" data-route="stats">
      <span>Stats</span>
    </button>
    <button class="nav-item" data-route="history">
      <span>History</span>
    </button>
    <button class="nav-item" data-route="settings">
      <span>Settings</span>
    </button>
  </nav>

  <!-- Share Dialog -->
  <div id="share-dialog" class="dialog-backdrop hidden">
    <div class="dialog-card">
      <button id="share-close">✕</button>
      <h2>Share your win</h2>
      <pre id="share-text"></pre>
      <button id="share-copy-btn">Copy</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <!-- Confetti -->
  <div id="confetti-layer" class="confetti-layer"></div>

  <script src="app.js"></script>
</body>
</html>
